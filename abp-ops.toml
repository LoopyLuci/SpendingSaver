# What this project can do, as ABP operations (abp_modkit). Edit freely: adopting it again
# (`python -m abp_modkit adopt .`) keeps edited summaries, settings and ops you added, and picks up new
# routes and commands.

[service]
id = "spending-saver"
name = "SpendingSaver"
description = "Light, fast cross-platform desktop app shell with:"
base_url = "http://127.0.0.1:27215"
health = "/health"
start = ["{python}", "-m", "uvicorn", "app.api:app", "--host", "127.0.0.1", "--port", "27215"]
cwd = "polyglot-app/backend"
ready_timeout_s = 90

[[op]]
id = "polyglot_backend.run"
kind = "cmd"
summary = "Run `polyglot-backend` with the given arguments"
argv = ["{venv_bin}/polyglot-backend{exe}"]
timeout_s = 900
extra_args = true

[[op]]
id = "script.standalone_server"
kind = "cmd"
summary = "Standalone entry point for the SpendingSaver backend."
argv = ["{python}", "polyglot-app/backend/standalone_server.py"]
timeout_s = 900
extra_args = true

[[op]]
id = "spendingsaver.dev"
kind = "cmd"
summary = "`npm run dev`: vite"
argv = ["npm", "run", "dev"]
cwd = "polyglot-app/tauri-app"
timeout_s = 86400
background = true
extra_args = true

[[op]]
id = "spendingsaver.build"
kind = "cmd"
summary = "`npm run build`: tsc && vite build"
argv = ["npm", "run", "build"]
cwd = "polyglot-app/tauri-app"
timeout_s = 3600
background = true
extra_args = true

[[op]]
id = "spendingsaver.preview"
kind = "cmd"
summary = "`npm run preview`: vite preview"
argv = ["npm", "run", "preview"]
cwd = "polyglot-app/tauri-app"
timeout_s = 86400
background = true
extra_args = true

[[op]]
id = "spendingsaver.tauri"
kind = "cmd"
summary = "`npm run tauri`: tauri"
argv = ["npm", "run", "tauri"]
cwd = "polyglot-app/tauri-app"
timeout_s = 3600
extra_args = true

[[op]]
id = "spendingsaver.test"
kind = "cmd"
summary = "`npm run test`: vitest run"
argv = ["npm", "run", "test"]
cwd = "polyglot-app/tauri-app"
timeout_s = 3600
background = true
extra_args = true

[[op]]
id = "app.dev"
kind = "cmd"
summary = "Run the SpendingSaver desktop app in development mode"
argv = ["npm", "run", "tauri", "dev"]
cwd = "polyglot-app/tauri-app"
timeout_s = 86400
background = true

[[op]]
id = "app.build"
kind = "cmd"
summary = "Build the SpendingSaver desktop app (installer)"
argv = ["npm", "run", "tauri", "build"]
cwd = "polyglot-app/tauri-app"
timeout_s = 7200
background = true

[[op]]
id = "spendingsaver_mcp.run"
kind = "cmd"
summary = "Run `spendingsaver-mcp` with the given arguments"
argv = ["{venv_bin}/spendingsaver-mcp{exe}"]
timeout_s = 900
extra_args = true

[[op]]
id = "spendingsaver_web.dev"
kind = "cmd"
summary = "`npm run dev`: vite"
argv = ["npm", "run", "dev"]
cwd = "spendingsaver-web"
timeout_s = 86400
background = true
extra_args = true

[[op]]
id = "spendingsaver_web.build"
kind = "cmd"
summary = "`npm run build`: tsc && vite build"
argv = ["npm", "run", "build"]
cwd = "spendingsaver-web"
timeout_s = 3600
background = true
extra_args = true

[[op]]
id = "spendingsaver_web.preview"
kind = "cmd"
summary = "`npm run preview`: vite preview"
argv = ["npm", "run", "preview"]
cwd = "spendingsaver-web"
timeout_s = 86400
background = true
extra_args = true

[[op]]
id = "gradle_spendingsaverandroid.assembledebug"
kind = "cmd"
summary = "Gradle assembleDebug (Android)"
argv = ["{project}/SpendingSaverAndroid/gradlew{bat}", "assembleDebug"]
cwd = "SpendingSaverAndroid"
timeout_s = 7200
background = true
extra_args = true

[[op]]
id = "gradle_spendingsaverandroid.test"
