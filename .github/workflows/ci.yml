name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpendingSaverAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polyglot-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest tests/test_api.py tests/test_sync_v1.py -q
      - name: Validate migrations (upgrade, downgrade, upgrade)
        env:
          SS_DATA_DIR: ${{ runner.temp }}/ss-data
          SS_DB_PATH: ${{ runner.temp }}/ss-data/migrate.db
        run: |
          mkdir -p "$SS_DATA_DIR"
          python -c "from app.database import init_db; init_db()"
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  go-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polyglot-app/go-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: polyglot-app/go-service/go.mod
      - name: Run Go tests
        run: go test -count=1 ./...

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polyglot-app/tauri-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: polyglot-app/tauri-app/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
