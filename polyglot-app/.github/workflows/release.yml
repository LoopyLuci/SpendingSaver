name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: polyglot-app/tauri-app/package-lock.json
      - name: Install dependencies
        run: |
          cd polyglot-app/tauri-app
          npm ci
      - name: Run frontend tests
        run: |
          cd polyglot-app/tauri-app
          npm run test
      - name: Build frontend
        run: |
          cd polyglot-app/tauri-app
          npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run Rust tests
        run: |
          cd polyglot-app/tauri-app/src-tauri
          cargo test --test smoke_test --lib

  package:
    needs: [frontend, rust]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: polyglot-app/tauri-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install dependencies
        run: |
          cd polyglot-app/tauri-app
          npm ci
      - name: Build release
        run: |
          cd polyglot-app/tauri-app
          npx tauri build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-app-windows-x64
          path: |
            polyglot-app/tauri-app/src-tauri/target/release/tauri-app.exe
            polyglot-app/tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            polyglot-app/tauri-app/src-tauri/target/release/bundle/msi/*.msi
