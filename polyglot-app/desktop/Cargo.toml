[package]
name = "spendingsaver-desktop"
version = "1.1.0"
edition = "2021"
description = "SpendingSaver desktop: a native Rust app (egui) with its own local database. No webview, no sidecar processes."
publish = false

[[bin]]
name = "spendingsaver"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.29", features = ["datepicker"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tiny_http = "0.12"
sha2 = "0.10"
ureq = "2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1
