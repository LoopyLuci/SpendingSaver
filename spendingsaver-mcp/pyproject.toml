[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spendingsaver-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1",
    "requests>=2.31.0",
]

[project.scripts]
spendingsaver-mcp = "spendingsaver_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
