[project]
name = "spendingsaver-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0",
    "cryptography>=41.0.0",
    # runtime deps not declared earlier: SQLAlchemy ORM, Alembic migrations,
    # HTTP client for TestClient + scripts/start.py
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    # UploadFile endpoints in app/api.py fail at import without this.
    "python-multipart>=0.0.9",
    # app/auth.py falls back to unsigned tokens when PyJWT is missing.
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
monitoring = ["sentry-sdk>=1.40.0"]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The project is laid out as backend/app (package) + backend/tests + backend/alembic.
# Without this, hatchling cannot determine which files to ship.
packages = ["app"]

[project.scripts]
spendingsaver-backend = "app.cli:main"
